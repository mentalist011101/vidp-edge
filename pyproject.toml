[project]
name = "vidp-edge"
version = "0.1.0"
description = "Pipeline vidéo adaptatif Edge–Cloud (projet Cloud Computing, ENSPY)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

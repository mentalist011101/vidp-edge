name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Style et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les outils
        run: pip install ruff pytest
      - name: Style (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: |
          pytest -q || code=$?
          # Code 5 = aucun test trouvé : accepté tant que le projet démarre.
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 5 ]; then exit "$code"; fi
